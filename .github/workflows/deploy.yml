name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy crud           --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy ai-chat        --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy career-coach   --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy proactive      --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --no-verify-jwt

      - name: Set Function Secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase secrets set ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }} \
            CRON_SECRET=${{ secrets.CRON_SECRET }} \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

  daily-briefing:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Trigger proactive briefing
        run: |
          curl -sS -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/proactive" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"

# Separate workflow handles the daily cron — see .github/workflows/cron.yml
